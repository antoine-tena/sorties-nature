services:
  mysql:
    image: mysql:8.4
    container_name: sorties-mysql
    restart: unless-stopped
    command: --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: sorties_natures
      MYSQL_USER: sorties_user
      MYSQL_PASSWORD: sorties_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./bdd.sql:/docker-entrypoint-initdb.d/01-bdd.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "sorties_user", "-psorties_password"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
