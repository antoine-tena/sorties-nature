services:
  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: sorties-web
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: sorties_natures
      DB_USER: sorties_user
      DB_PASSWORD: sorties_password
    ports:
      - "3000:80"
    volumes:
      - .:/var/www/html

  mysql:
    image: mysql:8.4
    container_name: sorties-mysql
    restart: unless-stopped
    command: --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: sorties_natures
      MYSQL_USER: sorties_user
      MYSQL_PASSWORD: sorties_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "sorties_user", "-psorties_password"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
