<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter une sortie - Sorties Natures</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
    <a href="/" class="logo"> Sorties Natures</a>
    <div>
        <a href="/">Accueil</a>
        <a href="ajouter.html">Ajouter une sortie</a>
    </div>
</nav>

<div class="container">
    <h1>Nouvelle sortie</h1>

    <form id="form-ajout" enctype="multipart/form-data">

        <div class="form-groupe">
            <label for="titre">Titre *</label>
            <input type="text" name="titre" id="titre" required placeholder="ex: Tour du lac Blanc">
        </div>

        <div class="form-groupe">
            <label for="description">Description</label>
            <textarea name="description" id="description" rows="4" placeholder="Décrivez la sortie..."></textarea>
        </div>

        <div style="display:flex; gap:15px; flex-wrap:wrap;">
            <div class="form-groupe" style="flex:1;">
                <label for="id_type_sortie">Type</label>
                <select name="id_type_sortie" id="id_type_sortie" required>
                    <option value="">-- choisir --</option>
                </select>
            </div>
            <div class="form-groupe" style="flex:1;">
                <label for="difficulte">Difficulté</label>
                <select name="difficulte" id="difficulte">
                    <option value="">-- choisir --</option>
                    <option>Facile</option>
                    <option>Moyen</option>
                    <option>Difficile</option>
                    <option>Très difficile</option>
                </select>
            </div>
        </div>

        <div style="display:flex; gap:15px; flex-wrap:wrap;">
            <div class="form-groupe" style="flex:1;">
                <label for="distance">Distance (km)</label>
                <input type="number" name="distance" id="distance" step="0.1" min="0">
            </div>
            <div class="form-groupe" style="flex:1;">
                <label for="denivele_positif">Dénivelé + (m)</label>
                <input type="number" name="denivele_positif" id="denivele_positif" min="0">
            </div>
        </div>

        <!-- Ajout du Géo-référencement (Point 1 du cahier des charges) -->
        <div style="display:flex; gap:15px; flex-wrap:wrap;">
            <div class="form-groupe" style="flex:1;">
                <label for="latitude">Latitude départ</label>
                <input type="number" name="latitude" id="latitude" step="0.000001" placeholder="ex: 45.8992">
            </div>
            <div class="form-groupe" style="flex:1;">
                <label for="longitude">Longitude départ</label>
                <input type="number" name="longitude" id="longitude" step="0.000001" placeholder="ex: 6.1293">
            </div>
        </div>

        <div class="form-groupe">
            <label>
                <input type="checkbox" name="chien_autorise" value="1" checked>
                Chien autorisé (ou tenu en laisse)
            </label>
        </div>

        <div class="form-groupe">
            <label for="gpx">Fichier GPX (optionnel)</label>
            <input type="file" name="gpx" id="gpx" accept=".gpx">
        </div>

        <div style="display:flex; gap:10px; align-items:center; margin-top:10px;">
            <button type="submit" class="btn btn-vert">Enregistrer la sortie</button>
            <a href="/" class="btn btn-gris">Annuler</a>
        </div>

        <p id="msg"></p>
    </form>
</div>

<script src="js/ajouter.js"></script>
</body>
</html>
