<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Importer des sorties - Sorties Natures</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
    <a href="/" class="logo">🥾 Sorties Natures</a>
    <div>
        <a href="/">Accueil</a>
        <a href="ajouter.html">Ajouter une sortie</a>
    </div>
</nav>

<div class="container">
    <h1>Importer des sorties</h1>
    <p style="margin-bottom:20px; color:#555;">Choisissez un fichier JSON exporté depuis cette application.</p>

    <form id="form-import" style="max-width:500px;">
        <div class="form-groupe">
            <label for="fichier">Fichier JSON</label>
            <input type="file" id="fichier" accept=".json" required>
        </div>
        <button type="submit" class="btn btn-vert">Importer</button>
        <p id="msg" style="margin-top:10px;"></p>
    </form>
</div>

<script>
document.getElementById('form-import').onsubmit = async (e) => {
    e.preventDefault();

    const fichier = document.getElementById('fichier').files[0];
    if (!fichier) return;

    const texte = await fichier.text();
    let data;
    try {
        data = JSON.parse(texte);
    } catch (err) {
        document.getElementById('msg').className = 'msg-err';
        document.getElementById('msg').textContent = 'Fichier JSON invalide.';
        return;
    }

    const res = await fetch('/api/import', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    });

    const msg = document.getElementById('msg');
    if (res.ok) {
        const result = await res.json();
        msg.className = 'msg-ok';
        msg.textContent = result.imported + ' sortie(s) importée(s) avec succès !';
    } else {
        const err = await res.json();
        msg.className = 'msg-err';
        msg.textContent = 'Erreur : ' + (err.error || 'inconnue');
    }
};
</script>
</body>
</html>
