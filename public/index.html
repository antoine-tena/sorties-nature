<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorties Natures</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
    <a href="/" class="logo">Sorties Natures</a>
    <div>
        <a href="/">Accueil</a>
        <a href="ajouter.html">Ajouter une sortie</a>
        <a href="importer.html">Importer JSON</a>
        <div id="nav-auth" class="nav-auth"></div>
    </div>
</nav>

<div class="container">
    <h1>Les sorties</h1>

    <div class="filtres">
        <input type="text" id="recherche" placeholder="Rechercher par titre...">
        <select id="filtre-type">
            <option value="">Tous les types</option>
        </select>
        <select id="filtre-difficulte">
            <option value="">Toute difficulté</option>
            <option>Facile</option>
            <option>Moyen</option>
            <option>Difficile</option>
            <option>Très difficile</option>
        </select>
        <label style="display:flex; align-items:center; gap:5px; font-size:0.9rem;">
            <input type="checkbox" id="filtre-chien"> Chien autorisé
        </label>
    </div>
    <p id="compteur" style="margin-bottom:15px; font-size:0.9rem; color:#777;"></p>

    <div id="liste-sorties"></div>
</div>

<script src="js/core/session.js"></script>
<script src="js/core/api.js"></script>
<script src="js/core/require-auth.js"></script>
<script src="js/pages/index.js"></script>
</body>
</html>
