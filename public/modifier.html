<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier une sortie - Sorties Natures</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>

<nav>
    <a href="/" class="logo">Sorties Natures</a>
    <div>
        <a href="/">Accueil</a>
        <a href="ajouter.html">Ajouter une sortie</a>
        <div id="nav-auth" class="nav-auth"></div>
    </div>
</nav>

<div class="container">
    <h1>Modifier la sortie</h1>

    <form id="form-modifier" enctype="multipart/form-data">

        <div class="form-groupe">
            <label for="titre">Titre *</label>
            <input type="text" name="titre" id="titre" required>
        </div>

        <div class="form-groupe">
            <label for="description">Description</label>
            <textarea name="description" id="description" rows="4"></textarea>
        </div>

        <div style="display:flex; gap:15px; flex-wrap:wrap;">
            <div class="form-groupe" style="flex:1;">
                <label for="id_type_sortie">Type</label>
                <select name="id_type_sortie" id="id_type_sortie">
                    <option value="">-- choisir --</option>
                </select>
            </div>
            <div class="form-groupe" style="flex:1;">
                <label for="difficulte">Difficulté</label>
                <select name="difficulte" id="difficulte">
                    <option value="">-- choisir --</option>
                    <option>Facile</option>
                    <option>Moyen</option>
                    <option>Difficile</option>
                    <option>Très difficile</option>
                </select>
            </div>
        </div>

        <div style="display:flex; gap:15px; flex-wrap:wrap;">
            <div class="form-groupe" style="flex:1;">
                <label for="distance">Distance (km)</label>
                <input type="number" name="distance" id="distance" step="0.1" min="0">
            </div>
            <div class="form-groupe" style="flex:1;">
                <label for="denivele_positif">Dénivelé + (m)</label>
                <input type="number" name="denivele_positif" id="denivele_positif" min="0">
            </div>
        </div>

        <div style="display:flex; gap:15px; flex-wrap:wrap;">
            <div class="form-groupe" style="flex:1;">
                <label for="latitude">Latitude départ</label>
                <input type="number" name="latitude" id="latitude" step="0.000001">
            </div>
            <div class="form-groupe" style="flex:1;">
                <label for="longitude">Longitude départ</label>
                <input type="number" name="longitude" id="longitude" step="0.000001">
            </div>
        </div>

        <div class="form-groupe">
            <label>
                <input type="checkbox" name="chien_autorise" id="chien_autorise" value="1">
                Chien autorisé (ou tenu en laisse)
            </label>
        </div>

        <div class="form-groupe">
            <label for="gpx">Fichier GPX (optionnel)</label>
            <input type="file" name="gpx" id="gpx" accept=".gpx">
        </div>

        <div class="form-groupe">
            <label>Trace sur la carte</label>
            <p class="field-help">Cliquez sur la carte pour ajouter des points ou importez un GPX existant pour le modifier visuellement.</p>
            <div id="carte-trace-modifier" class="carte-trace"></div>
            <div class="trace-actions">
                <button type="button" class="btn btn-gris" id="export-gpx">Exporter le trace en GPX</button>
                <button type="button" class="btn btn-gris" id="vider-trace">Vider le trace</button>
            </div>
            <p id="trace-info" class="field-help">Aucun point sur la carte.</p>
        </div>

        <div style="display:flex; gap:10px; align-items:center; margin-top:10px;">
            <button type="submit" class="btn btn-vert">Enregistrer</button>
            <a id="btn-annuler" href="/" class="btn btn-gris">Annuler</a>
        </div>

        <p id="msg"></p>
    </form>
</div>

<script src="js/auth.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/trace-map.js"></script>
<script src="js/modifier.js"></script>
</body>
</html>
