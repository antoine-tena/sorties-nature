##
# Ce fichier configure le virtual host Apache du projet.
# Il indique ou se trouve le frontend public, autorise les regles .htaccess
# et expose aussi le dossier uploads pour servir les fichiers GPX envoyes.
# En clair, il fait le lien entre l'image Apache et l'arborescence du depot.
##

<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/frontend/public

    <Directory /var/www/html/frontend/public>
        AllowOverride All
        Require all granted
    </Directory>

    Alias /uploads /var/www/html/uploads

    <Directory /var/www/html/uploads>
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>