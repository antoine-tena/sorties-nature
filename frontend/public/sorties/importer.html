<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Importer des sorties - Sorties Natures</title>
    <link rel="stylesheet" href="/shared/style.css">
</head>
<body>

<!--
Cette page sert a importer un fichier JSON exporte par l'application.
Elle reste volontairement minimaliste : un champ fichier, un bouton et une zone de message.
Le script associe lit le JSON dans le navigateur puis l'envoie au backend pour l'import.
Son role est donc surtout de proposer une interface rapide pour recharger des donnees.
-->

<nav>
    <a href="/" class="logo">Sorties Natures</a>
    <div>
        <a href="/">Accueil</a>
        <a href="/sorties/ajouter.html">Ajouter une sortie</a>
        <div id="nav-auth" class="nav-auth"></div>
    </div>
</nav>

<div class="container">
    <h1>Importer des sorties</h1>
    <p style="margin-bottom:20px; color:#555;">Choisissez un fichier JSON exporté depuis cette application.</p>

    <form id="form-import" style="max-width:500px;">
        <div class="form-groupe">
            <label for="fichier">Fichier JSON</label>
            <input type="file" id="fichier" accept=".json" required>
        </div>
        <button type="submit" class="btn btn-vert">Importer</button>
        <p id="msg" style="margin-top:10px;"></p>
    </form>
</div>

<script src="/shared/session.js"></script>
<script src="/shared/api.js"></script>
<script src="/shared/require-auth.js"></script>
<script src="/sorties/importer.js"></script>
</body>
</html>
