<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Sorties Natures</title>
    <link rel="stylesheet" href="/shared/style.css">
</head>
<body>

<!--
Cette page affiche le formulaire de connexion de l'application.
Elle sert juste a recuperer l'email et le mot de passe avant envoi a l'API.
Le JavaScript de la page s'occupe ensuite du message de retour et de la redirection.
La structure HTML reste volontairement simple pour aller droit au but.
-->

<nav>
    <a href="/" class="logo">Sorties Natures</a>
    <div>
        <a href="/">Accueil</a>
        <a href="/sorties/ajouter.html">Ajouter une sortie</a>
        <div id="nav-auth" class="nav-auth"></div>
    </div>
</nav>

<div class="container">
    <h1>Connexion</h1>
    <form id="form-connexion" class="auth-card">
        <p class="auth-note">Connectez-vous avec votre email et votre mot de passe.</p>

        <div class="form-groupe">
            <label for="email">Email</label>
            <input type="email" id="email" required>
        </div>

        <div class="form-groupe">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" required>
        </div>

        <div style="display:flex; gap:10px; align-items:center;">
            <button type="submit" class="btn btn-vert">Se connecter</button>
            <a href="/auth/inscription.html" class="btn btn-gris">Creer un compte</a>
        </div>

        <p id="msg"></p>
    </form>
</div>

<script src="/shared/session.js"></script>
<script src="/shared/guest-only.js"></script>
<script src="/auth/connexion.js"></script>
</body>
</html>
