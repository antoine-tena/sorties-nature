<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Sorties Natures</title>
    <link rel="stylesheet" href="/shared/style.css">
</head>
<body>

<nav>
    <a href="/" class="logo">Sorties Natures</a>
    <div>
        <a href="/">Accueil</a>
        <a href="/sorties/ajouter.html">Ajouter une sortie</a>
        <div id="nav-auth" class="nav-auth"></div>
    </div>
</nav>

<div class="container">
    <h1>Inscription</h1>
    <form id="form-inscription" class="auth-card">
        <p class="auth-note">Creez un compte pour avoir une session active dans l'application.</p>

        <div class="form-groupe">
            <label for="nom">Nom</label>
            <input type="text" id="nom" required>
        </div>

        <div class="form-groupe">
            <label for="email">Email</label>
            <input type="email" id="email" required>
        </div>

        <div class="form-groupe">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" minlength="4" required>
        </div>

        <div style="display:flex; gap:10px; align-items:center;">
            <button type="submit" class="btn btn-vert">S'inscrire</button>
            <a href="/auth/connexion.html" class="btn btn-gris">J'ai deja un compte</a>
        </div>

        <p id="msg"></p>
    </form>
</div>

<script src="/shared/session.js"></script>
<script src="/shared/guest-only.js"></script>
<script src="/auth/inscription.js"></script>
</body>
</html>
